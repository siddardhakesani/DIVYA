<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sky6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f0933"/>
      <stop offset="50%" stop-color="#551a66"/>
      <stop offset="100%" stop-color="#8c2368"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky6)"/>
  
  <!-- Infinity Symbol with Hearts -->
  <g transform="translate(400, 270) scale(1.6)">
    <!-- Glowing infinity ribbon -->
    <path d="M-60 0 C -100 -50, -100 50, -60 0 C -20 -50, 20 50, 60 0 C 100 -50, 100 50, 60 0 C 20 -50, -20 50, -60 0 Z" 
          fill="none" stroke="#ff758c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
          filter="drop-shadow(0 0 12px #ff4d88)"/>
    <path d="M-60 0 C -100 -50, -100 50, -60 0 C -20 -50, 20 50, 60 0 C 100 -50, 100 50, 60 0 C 20 -50, -20 50, -60 0 Z" 
          fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          
    <!-- Little Hearts at Centers -->
    <path d="M-60 -5 C -65 -15 -75 -10 -75 0 C -75 10 -60 20 -60 20 C -60 20 -45 10 -45 0 C -45 -10 -55 -15 -60 -5 Z" fill="#ffd700"/>
    <path d="M60 -5 C 55 -15 45 -10 45 0 C 45 10 60 20 60 20 C 60 20 75 10 75 0 C 75 -10 65 -15 60 -5 Z" fill="#ffd700"/>
  </g>
  
  <text x="400" y="470" font-family="'Dancing Script', cursive, serif" font-size="46" fill="#ffd1dc" font-weight="bold" text-anchor="middle">Forever &amp; Always Yours</text>
  <text x="400" y="530" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="22" fill="#ffb6c1" text-anchor="middle" letter-spacing="3">TO INFINITY AND BEYOND 💖♾️</text>
</svg>